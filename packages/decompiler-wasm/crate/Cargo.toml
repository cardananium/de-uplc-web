[package]
name = "de-uplc-decompiler-wasm"
version = "0.1.0"
edition = "2021"
description = "Thin wasm-bindgen wrapper over the dehosk UPLC decompiler, for the de-uplc-web app."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# dehosk's aiken branch, on the uplc fork revision the engine runs (arrays), from a local checkout
# until the revision is pushed; then this becomes the GitHub URL again.
dehosk = { git = "file:///home/evgenii/svc/dehosk-public", rev = "8aa8f087418f9cb4f372e37ad331b0064a0b46e4" }

wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
# Enable getrandom's wasm "js" backend for the whole dependency tree (uplc/pallas pull it in).
# Feature unification makes this apply transitively; without it wasm32-unknown-unknown won't link.
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory"]
