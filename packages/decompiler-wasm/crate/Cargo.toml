[package]
name = "de-uplc-decompiler-wasm"
version = "0.1.0"
edition = "2021"
description = "Thin wasm-bindgen wrapper over the dehosk UPLC decompiler, for the de-uplc-web app."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# dehosk's aiken branch, on the uplc fork revision the engine runs, from a local checkout
# until the revision is pushed; then this becomes the GitHub URL again.
dehosk = { git = "file:///home/evgenii/svc/dehosk-public", rev = "3a822d57d8854304b8f0dd0b8034e101f2324bc3" }

wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
# Enable getrandom's wasm "js" backend for the whole dependency tree (uplc/pallas pull it in).
# Feature unification makes this apply transitively; without it wasm32-unknown-unknown won't link.
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory"]

# The stack-safe PlutusData dehosk and the uplc fork build against.
[patch.crates-io]
pallas-addresses = { git = "file:///home/evgenii/svc/pallas", rev = "437295c63d1846a50692129655205ed2182c54f3" }
pallas-codec = { git = "file:///home/evgenii/svc/pallas", rev = "437295c63d1846a50692129655205ed2182c54f3" }
pallas-crypto = { git = "file:///home/evgenii/svc/pallas", rev = "437295c63d1846a50692129655205ed2182c54f3" }
pallas-primitives = { git = "file:///home/evgenii/svc/pallas", rev = "437295c63d1846a50692129655205ed2182c54f3" }
pallas-traverse = { git = "file:///home/evgenii/svc/pallas", rev = "437295c63d1846a50692129655205ed2182c54f3" }
