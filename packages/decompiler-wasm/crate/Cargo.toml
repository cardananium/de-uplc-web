[package]
name = "de-uplc-decompiler-wasm"
version = "0.1.0"
edition = "2021"
description = "Thin wasm-bindgen wrapper over the dehosk UPLC decompiler, for the de-uplc-web app."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dehosk = { git = "https://github.com/cardananium/dehosk", rev = "8f8b6a9cce22974e289e61a27a7f3dd5e6fc5228" }

wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
# Enable getrandom's wasm "js" backend for the whole dependency tree (uplc/pallas pull it in).
# Feature unification makes this apply transitively; without it wasm32-unknown-unknown won't link.
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory"]
