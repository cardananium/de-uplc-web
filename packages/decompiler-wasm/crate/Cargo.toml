[package]
name = "de-uplc-decompiler-wasm"
version = "0.1.0"
edition = "2021"
description = "Thin wasm-bindgen wrapper over the dehosk UPLC decompiler, for the de-uplc-web app."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# dehosk's aiken branch, on the uplc fork revision the engine runs.
dehosk = { git = "https://github.com/cardananium/dehosk.git", rev = "3e28b7eafbd1a6908441fddb2e2332b9afdb76a5" }

wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
# Enable getrandom's wasm "js" backend for the whole dependency tree (uplc/pallas pull it in).
# Feature unification makes this apply transitively; without it wasm32-unknown-unknown won't link.
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--enable-bulk-memory"]

# The stack-safe PlutusData dehosk and the uplc fork build against.
[patch.crates-io]
pallas-addresses = { git = "https://github.com/cardananium/pallas.git", rev = "437295c63d1846a50692129655205ed2182c54f3" }
pallas-codec = { git = "https://github.com/cardananium/pallas.git", rev = "437295c63d1846a50692129655205ed2182c54f3" }
pallas-crypto = { git = "https://github.com/cardananium/pallas.git", rev = "437295c63d1846a50692129655205ed2182c54f3" }
pallas-primitives = { git = "https://github.com/cardananium/pallas.git", rev = "437295c63d1846a50692129655205ed2182c54f3" }
pallas-traverse = { git = "https://github.com/cardananium/pallas.git", rev = "437295c63d1846a50692129655205ed2182c54f3" }
