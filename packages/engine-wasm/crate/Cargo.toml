[package]
name = "de-uplc"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The fork's branch de-uplc-v1.1.24 (arrays, builtins gated as the ledger gates them, stack safety),
# from a local checkout until the revision is pushed; then this becomes the GitHub URL again.
uplc = { git = "file:///home/evgenii/svc/aiken", rev = "8f5587e1c2b9468618de8d6b7d7a42021bfa2c3c" }
serde = { version = "1.0", features = ["derive"] }
# `raw_value`: deep Plutus Data is written to JSON without recursion, then embedded as is.
serde_json = { version = "1.0", features = ["raw_value"] }
hex = "0.4"
pallas-primitives = "0.35"
pallas-codec = { version = "0.35", features = ["num-bigint"] }
pallas-traverse = "0.35"
pallas-addresses = "0.35"
pallas-crypto = "0.35"
blst = "0.3"
num-bigint = "0.4"
schemars = "1.0.4"
thiserror = "2.0.10"
getrandom = { version = "0.2.16", features = ["js"] }

# Target-specific dependencies
[target.'cfg(all(target_arch = "wasm32", not(target_os = "emscripten")))'.dependencies]
wasm-bindgen = { version = "0.2.100", features = ["serde-serialize"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
console_error_panic_hook = "0.1"

[target.'cfg(not(all(target_arch = "wasm32", not(target_os = "emscripten"))))'.dependencies]
noop_proc_macro = "0.3"
serde_derive = "1.0"
actix-web = "4.9"
actix-cors = "0.7"
tokio = { version = "1.0", features = ["full"] }
env_logger = "0.11"
tokio-util = "0.7"

# The fork reads, writes, clones and drops Plutus Data without recursion only with pallas built from
# the pallas fork's branch cquisitor/stack-safe-plutus-data, from a local checkout until the
# revision is pushed, as the fork's own workspace patches it.
[patch.crates-io]
pallas-addresses = { git = "file:///home/evgenii/svc/pallas", rev = "437295c63d1846a50692129655205ed2182c54f3" }
pallas-codec = { git = "file:///home/evgenii/svc/pallas", rev = "437295c63d1846a50692129655205ed2182c54f3" }
pallas-crypto = { git = "file:///home/evgenii/svc/pallas", rev = "437295c63d1846a50692129655205ed2182c54f3" }
pallas-primitives = { git = "file:///home/evgenii/svc/pallas", rev = "437295c63d1846a50692129655205ed2182c54f3" }
pallas-traverse = { git = "file:///home/evgenii/svc/pallas", rev = "437295c63d1846a50692129655205ed2182c54f3" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-bulk-memory"]