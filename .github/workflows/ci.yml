name: CI

on:
  push:
    branches: [main]
  pull_request:

# The Rust→WASM engine (packages/engine-wasm/pkg) is NOT committed — the `check` job builds it
# from rust-src on stable Rust (wasm-pack --target web; on Linux the distro clang has the wasm
# backend, so no toolchain override is needed). Rebuild locally with `npm run build:wasm` (the
# dev/build prebuild guard does this automatically when pkg/ is missing).
#
# NOTE: the headless-Chrome E2E job is temporarily removed — the apps/web/e2e suite is gitignored
# for now. Re-add the job (and un-ignore apps/web/e2e) once the suite is committed.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --- Build the engine WASM (not committed) ---
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-src
      - name: Build engine WASM
        run: npm run build:wasm

      - run: npm ci

      - name: Schema ↔ generated-types drift check
        run: npm run check:schema

      - name: Typecheck (core + engine-worker + web)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Build web
        run: npm run build:web

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
