name: CI

on:
  push:
    branches: [main]
  pull_request:

# Both WASM artifacts are built here (engine via wasm-pack, decompiler via cargo +
# wasm-bindgen-cli). Linux distro clang has the wasm backend; no LLVM override.
# Local rebuild: `npm run build:wasm` / `npm run build:decompiler-wasm` (predev/prebuild
# run ensure-wasm.mjs if pkg/ is missing).
#
# NOTE: the headless-Chrome E2E job is temporarily removed — the apps/web/e2e suite is gitignored
# for now. Re-add the job (and un-ignore apps/web/e2e) once the suite is committed.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack,wasm-bindgen-cli@0.2.127
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/engine-wasm/crate
            packages/decompiler-wasm/crate
      - name: Build engine WASM
        run: npm run build:wasm
      - name: Build decompiler WASM
        run: npm run build:decompiler-wasm

      - run: npm ci

      - name: Schema ↔ generated-types drift check
        run: npm run check:schema

      - name: Typecheck (core + engine-worker + web)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Build web
        run: npm run build:web

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
